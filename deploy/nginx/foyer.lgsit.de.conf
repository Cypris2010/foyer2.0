# nginx on 10.16.0.6: TLS for foyer.lgsit.de, forwards to Foyer on abydos (deploy/compose.abydos.yaml).
#   /etc/nginx/sites-available/foyer.lgsit.de -> sites-enabled, then: nginx -t && systemctl reload nginx

upstream foyer {
    server 10.16.0.7:8030;
    keepalive 16;
}

server {
    listen 80;
    server_name foyer.lgsit.de;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foyer.lgsit.de;

    # Wildcard certificate for *.lgsit.de, same paths as the other lgsit.de sites
    ssl_certificate     /etc/letsencrypt/live/lgsit.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lgsit.de/privkey.pem;

    # Media uploads up to FOYER_MEDIA_MAX_MB (2048)
    client_max_body_size 2g;
    client_body_timeout 10m;

    # Foyer sends HSTS itself when X-Forwarded-Proto is https.

    location / {
        proxy_pass http://foyer;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Live updates are a long-lived stream; uploads go straight through
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      1h;
        proxy_send_timeout      10m;
    }
}
