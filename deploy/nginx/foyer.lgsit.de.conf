# foyer.lgsit.de
# --------------
# Foyer on abydos (deploy/compose.abydos.yaml), nginx on 10.16.0.6 in the lgsit.de house style.
server {
    listen 443 ssl;
    server_name foyer.lgsit.de;
    root /var/www/html;
    include ssl.conf.d/lgsit.de.conf;
    location / {
        proxy_pass http://10.16.0.7:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        # Media uploads up to FOYER_MEDIA_MAX_MB (2048), passed straight through
        client_max_body_size 2g;
        client_body_timeout 10m;
        proxy_request_buffering off;
        # Live updates are a long-lived stream
        proxy_buffering off;
        proxy_connect_timeout 90;
        proxy_send_timeout 10m;
        proxy_read_timeout 1h;
        # Foyer sends HSTS itself when X-Forwarded-Proto is https.
    }
}
