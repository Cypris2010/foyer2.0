# Foyer on abydos (10.16.0.7) as a Portainer git stack, without live slides.
# TLS reverse proxy is the nginx on 10.16.0.6 (foyer.lgsit.de -> 10.16.0.7:8030).
# Firewall on abydos: 8030 TCP only from 10.16.0.6.
# Live slides later: add the live-gateway service from compose.yaml and FOYER_LIVE_GATEWAY(_KEY).
services:
  foyer:
    build:
      context: ..
    image: foyer:local
    restart: unless-stopped
    # Host network, so the nginx address arrives unchanged and X-Forwarded-For can be trusted.
    network_mode: host
    environment:
      FOYER_HOST: 10.16.0.7
      FOYER_PORT: 8030
      FOYER_TRUSTED_PROXIES: 10.16.0.6
    volumes:
      - foyer-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://10.16.0.7:8030/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  foyer-data:
