# docker compose -f deploy/compose.yaml up -d --build
# Behind a TLS reverse proxy on the same host (KONZEPT 3.5).
# Needs FOYER_LIVE_GATEWAY_KEY in deploy/.env (openssl rand -hex 32).
services:
  foyer:
    build:
      context: ..
    image: foyer:local
    restart: unless-stopped
    # Host network like before: the reverse proxy reaches Foyer on 127.0.0.1, so
    # X-Forwarded-For stays trusted and the school-network check sees real addresses.
    network_mode: host
    environment:
      FOYER_HOST: 127.0.0.1
      FOYER_PORT: 8080
      FOYER_LIVE_GATEWAY: http://127.0.0.1:8190
      FOYER_LIVE_GATEWAY_KEY: ${FOYER_LIVE_GATEWAY_KEY:?FOYER_LIVE_GATEWAY_KEY in deploy/.env setzen}
    volumes:
      - foyer-data:/data

  # Live slides (apps/live-gateway). Leave it out (and FOYER_LIVE_GATEWAY above) without live video,
  # or run it on a machine in the AV network instead (deploy/live-gateway.compose.yaml).
  live-gateway:
    build:
      context: ..
      dockerfile: apps/live-gateway/Dockerfile
      args:
        # NDI live input: set both to build the separate ffmpeg with NDI (nonfree, never publish the image).
        FOYER_NDI: "0"
        NDI_LICENSE: ""
    image: foyer-live-gateway:local
    restart: unless-stopped
    # WebRTC media on port 8189 (UDP, TCP fallback) straight to the displays.
    # NDI finds sources via mDNS/multicast, which does not cross Docker's bridge network.
    network_mode: host
    # Converting video is CPU-heavy; keep some for Foyer itself.
    cpus: 2
    environment:
      FOYER_GATEWAY_HOST: 127.0.0.1
      FOYER_LIVE_GATEWAY_KEY: ${FOYER_LIVE_GATEWAY_KEY:?FOYER_LIVE_GATEWAY_KEY in deploy/.env setzen}
      # FOYER_NDI_EXTRA_IPS: 10.48.20.5,10.48.20.9   # NDI senders in other subnets
      # FOYER_NDI_GROUPS: public,lgstv               # NDI groups to search (default: public only)
    volumes:
      # NDI uses the host's avahi-daemon (mDNS) over D-Bus; without it only FOYER_NDI_EXTRA_IPS work.
      - /run/dbus:/run/dbus

volumes:
  foyer-data:
