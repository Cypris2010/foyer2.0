# docker compose -f deploy/compose.yaml up -d --build
# Behind a TLS reverse proxy on the same host (KONZEPT 3.5).
services:
  foyer:
    build:
      context: ..
      args:
        # NDI live input: set both to build the separate ffmpeg with NDI (nonfree, never publish the image).
        FOYER_NDI: "0"
        NDI_LICENSE: ""
    image: foyer:local
    restart: unless-stopped
    # Live slides: WebRTC media on port 8189 (UDP, TCP fallback) straight to the displays.
    # NDI finds sources via mDNS/multicast, which does not cross Docker's bridge network.
    network_mode: host
    environment:
      FOYER_HOST: 127.0.0.1
      FOYER_PORT: 8080
      # FOYER_NDI_EXTRA_IPS: 10.48.20.5,10.48.20.9   # NDI senders in other subnets
    volumes:
      - foyer-data:/data
      # NDI uses the host's avahi-daemon (mDNS) over D-Bus; without it only FOYER_NDI_EXTRA_IPS work.
      - /run/dbus:/run/dbus

volumes:
  foyer-data:
