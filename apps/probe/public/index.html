<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Foyer Geräte-Probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { font-size: 2.2vmin; }
  header { padding: 2vmin 3vmin; background: #1e293b; display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 1.6em; }
  #status { font-size: 1.2em; color: #facc15; }
  main { display: flex; height: calc(100% - 9vmin); }
  #results { flex: 1; padding: 2vmin 3vmin; overflow: hidden; columns: 2; column-gap: 4vmin; }
  .group { break-inside: avoid; margin-bottom: 1.6vmin; }
  .group h2 { margin: 0 0 .4em; font-size: 1.05em; color: #93c5fd; }
  .row { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding: .15em 0; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #facc15; }
  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: none; background: #000; }
  #stage.active { display: block; }
  #stage video { width: 100%; height: 100%; object-fit: contain; }
  #stage .label { position: absolute; left: 2vmin; bottom: 2vmin; background: rgba(0,0,0,.7); padding: .4em .8em; font-size: 1.4em; }
  .box { position: absolute; width: 12vmin; height: 12vmin; border-radius: 2vmin; background: #38bdf8; will-change: transform; }
  .layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; will-change: opacity; }
  .glass { position: absolute; left: 20%; top: 25%; width: 60%; height: 50%; background: rgba(255,255,255,.2); border-radius: 3vmin; }
</style>
</head>
<body>
<header>
  <h1>Foyer Geräte-Probe <span id="device"></span></h1>
  <div id="status">Startet …</div>
</header>
<main><div id="results"></div></main>
<div id="stage"></div>
<script src="probe.js"></script>
</body>
</html>
